<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas prep briefs — dashboard</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column;
         font: 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #bar { display: flex; gap: 8px; align-items: center; padding: 8px 14px;
         border-bottom: 1px solid rgba(128,128,128,.3); }
  #bar b { margin-right: auto; }
  button { font: inherit; font-size: 12px; padding: 5px 11px; border-radius: 6px;
           border: 1px solid rgba(128,128,128,.4); background: transparent; color: inherit; cursor: pointer; }
  button:hover { border-color: #7a5cff; }
  iframe { flex: 1; border: 0; width: 100%; }
  #empty { padding: 40px; opacity: .7; }
</style>
</head>
<body>
  <div id="bar">
    <b>Canvas prep briefs</b>
    <button id="save">Save as HTML</button>
    <button id="tab">Open in a tab</button>
  </div>
  <!--
    The dashboard is rendered into a sandboxed iframe rather than into this
    page. It is built from course text the extension did not write, and an
    extension page carries extension privileges — srcdoc with no allow-scripts
    means the worst a malformed syllabus can do is look wrong.
  -->
  <iframe id="frame" sandbox referrerpolicy="no-referrer" title="Dashboard"></iframe>
  <div id="empty" hidden>Nothing to show yet — open the panel on a Canvas tab and press “Full dashboard”.</div>
  <script src="viewer.js"></script>
</body>
</html>
