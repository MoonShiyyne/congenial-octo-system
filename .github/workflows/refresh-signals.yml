name: Refresh signals

# Keeps data/signals.json current so the sidebar — and the per-node signal
# markers on the web — reflect what has actually shipped and been discussed.
on:
  schedule:
    - cron: '17 */6 * * *'      # every 6 hours, off the hour
  workflow_dispatch:            # manual run
  push:
    paths:                      # re-map immediately when the graph changes
      - 'data/curriculum.mjs'
      - 'data/keywords.mjs'
      - 'data/sources.json'
      - 'tools/refresh-signals.mjs'

permissions:
  contents: write

concurrency:
  group: refresh-signals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch and classify signals
        run: node tools/refresh-signals.mjs

      - name: Verify the payload is usable
        run: node tools/validate.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/signals.json; then
            echo "No signal changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signals.json
          git commit -m "chore(signals): refresh feed $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
